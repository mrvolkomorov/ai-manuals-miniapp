<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мануалы | ИИ-инструменты для редакции</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-theme-text: var(--tg-theme-text-color, #000000);
            --tg-theme-hint: var(--tg-theme-hint-color, #999999);
            --tg-theme-link: var(--tg-theme-link-color, #2481cc);
            --tg-theme-button: var(--tg-theme-button-color, #2481cc);
            --tg-theme-button-text: var(--tg-theme-button-text-color, #ffffff);
            --tg-theme-secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --surface: #ffffff;
            --surface-hover: #f8fafc;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--tg-theme-secondary-bg);
            color: var(--tg-theme-text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .app-container { max-width: 480px; margin: 0 auto; padding-bottom: 80px; }

        .header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: white;
            padding: 24px 20px 32px;
            border-radius: 0 0 var(--radius-xl) var(--radius-xl);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 200px; height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -30%; left: -10%;
            width: 150px; height: 150px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
        .header-content { position: relative; z-index: 1; }
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .header-badge .dot {
            width: 6px; height: 6px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .header h1 { font-size: 22px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; }
        .header p { font-size: 14px; opacity: 0.9; line-height: 1.4; }

        .stats-bar {
            display: flex;
            gap: 16px;
            margin: -18px 20px 0;
            position: relative;
            z-index: 2;
        }
        .stat-item {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .stat-number { font-size: 24px; font-weight: 800; color: var(--accent); line-height: 1; }
        .stat-label { font-size: 11px; color: var(--tg-theme-hint); margin-top: 4px; font-weight: 500; }

        .filter-section { padding: 20px 20px 0; }
        .filter-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--tg-theme-hint);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--tg-theme-text);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .filter-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        .filter-tab:not(.active):hover { border-color: var(--accent-light); color: var(--accent); }

        .cards-section { padding: 16px 20px 0; }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cards-grid { display: flex; flex-direction: column; gap: 12px; }

        .manual-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .manual-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--accent-light); }
        .manual-card:active { transform: scale(0.98); }
        .card-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 12px; }
        .card-icon {
            width: 48px; height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .card-icon.mcp { background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); }
        .card-icon.api { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); }
        .card-icon.n8n { background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); }
        .card-icon.template { background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%); }
.card-icon.prompts { background: linear-gradient(135deg, #faf5ff 0%, #e9d5ff 100%); }
        .card-icon.reference { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); }
        .card-icon.visual { background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 100%); }
        .card-info { flex: 1; min-width: 0; }
        .card-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .card-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-mcp { background: #eff6ff; color: #2563eb; }
        .badge-api { background: #fffbeb; color: #d97706; }
        .badge-n8n { background: #f0fdf4; color: #16a34a; }
        .badge-template { background: #faf5ff; color: #9333ea; }
.badge-prompts { background: #f5f3ff; color: #7e22ce; }
        .badge-reference { background: #e0f2fe; color: #0284c7; }
        .badge-visual { background: #ffe4e6; color: #e11d48; }
        .card-desc {
            font-size: 13px;
            color: var(--tg-theme-hint);
            line-height: 1.5;
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-footer { display: flex; align-items: center; justify-content: space-between; }
        .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag {
            font-size: 11px;
            padding: 4px 8px;
            background: var(--tg-theme-secondary-bg);
            border-radius: 6px;
            color: var(--tg-theme-hint);
        }
        .open-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .open-btn:hover { background: var(--accent-dark); }

        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-text { font-size: 14px; color: var(--tg-theme-hint); }

        .footer { text-align: center; padding: 24px 20px 32px; font-size: 12px; color: var(--tg-theme-hint); opacity: 0.7; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .manual-card { animation: fadeInUp 0.4s ease forwards; }
        .manual-card:nth-child(1) { animation-delay: 0.05s; }
        .manual-card:nth-child(2) { animation-delay: 0.1s; }
        .manual-card:nth-child(3) { animation-delay: 0.15s; }
        .manual-card:nth-child(4) { animation-delay: 0.2s; }

        @media (prefers-color-scheme: dark) {
            :root { --surface: #1e1e1e; --surface-hover: #2a2a2a; --border: #333333; }
        }
        body.tg-theme-dark { --surface: #1c1c1d; --surface-hover: #2c2c2d; --border: #363636; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="header-badge"><span class="dot"></span>Курс ИИ-инструменты</div>
                <h1>Мануалы для участников</h1>
                <p>Медиахолдинг Шкулева · Региональная редакция</p>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-item"><div class="stat-number" id="totalCount">9</div><div class="stat-label">Мануалов</div></div>
            <div class="stat-item"><div class="stat-number">8</div><div class="stat-label">Категорий</div></div>
            <div class="stat-item"><div class="stat-number">v1.2</div><div class="stat-label">Версия</div></div>
        </div>

        <div class="filter-section">
            <div class="filter-label">Категории</div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">Все</button>
                <button class="filter-tab" data-filter="mcp">MCP-серверы</button>
                <button class="filter-tab" data-filter="api">API и модели</button>
                <button class="filter-tab" data-filter="n8n">n8n</button>
                <button class="filter-tab" data-filter="visual">Визуал</button>
                <button class="filter-tab" data-filter="prompts">Промпты</button>
                <button class="filter-tab" data-filter="template">Шаблоны</button>
                <button class="filter-tab" data-filter="reference">Справочник</button>
            </div>
        </div>

        <section class="cards-section">
            <h2 class="section-title">📚 Доступные мануалы</h2>
            <div class="cards-grid" id="manualsGrid"></div>
        </section>

        <footer class="footer"><p>Обновлено: 10 сентября 2026</p></footer>
    </div>

    <script>
        var manuals=[
            {id:'tgstat-mcp',title:'Развёртывание TGStat-MCP на Railway',description:'Пошаговое руководство по деплою MCP-сервера для анализа Telegram-каналов. Получение токена TGStat, настройка переменных окружения, проверка работоспособности.',url:'tgstat-mcp.html',category:'mcp',icon:'📊',iconClass:'mcp',badge:'TGStat',badgeClass:'badge-mcp',tags:['Railway','MCP','Аналитика']},
            {id:'telegram-mcp',title:'Развёртывание Telegram-MCP на Railway',description:'Установка и настройка MCP-сервера для работы с Telegram API. Создание приложения на my.telegram.org, получение api_id/api_hash, генерация session string.',url:'telegram-mcp.html',category:'mcp',icon:'💬',iconClass:'mcp',badge:'Telegram',badgeClass:'badge-mcp',tags:['MTProto','GitHub','Replit']},
            {id:'api-keys',title:'API-ключи и бюджетные модели для n8n',description:'Подключение нейросетей через OpenRouter и AiTunnel. Сравнение моделей (DeepSeek, Qwen, GLM, Claude), настройка кредитов, безопасное хранение ключей.',url:'api-keys.html',category:'api',icon:'🔑',iconClass:'api',badge:'API',badgeClass:'badge-api',tags:['OpenRouter','AiTunnel','Модели']},
            {id:'track-a',title:'Импорт шаблона Трек А в n8n (v1.2)',description:'Импорт готового workflow для мониторинга Telegram-каналов и автоматического репоста. Настройка credentials, подключение MCP-серверов, кастомизация фильтров.',url:'track-a.html',category:'template',icon:'⚡',iconClass:'template',badge:'Шаблон',badgeClass:'badge-template',tags:['Workflow','Мониторинг','Автоматизация']},
            {id:'cheat-sheet-prompts',title:'Библиотека аналитических промптов (14 шт.)',description:'Cheat-sheet с 14 готовыми шаблонами для SMM и редакции. Дашборды, конкурентный анализ, рерайт, адаптация под площадки, инфоповоды, дайджесты.',url:'cheat-sheet-prompts.html',category:'prompts',icon:'📝',iconClass:'prompts',badge:'Промпты',badgeClass:'badge-prompts',tags:['Шпаргалка','SMM','Аналитика','Шаблоны']},
            {id:'mcp-map',title:'Карта MCP-серверов',description:'Полная карта всех MCP-серверов курса: Telegram MCP, TGStat MCP, Firecrawl, Tavily, Composio. Что каждый умеет, как запустить, как подключить к ИИ-клиенту, что к какому блоку относится.',url:'mcp-map.html',category:'mcp',icon:'🗺️',iconClass:'mcp',badge:'MCP',badgeClass:'badge-mcp',tags:['Справочник','Карта','Все сервера']},
            {id:'n8n-checklist',title:'Чек-лист запуска n8n (8 шагов)',description:'От регистрации до первого запуска. Подключение LLM и Google Sheets, импорт шаблона, замена 3 значений, Execute и активация. Таблица типичных проблем.',url:'n8n-checklist.html',category:'n8n',icon:'🚀',iconClass:'n8n',badge:'n8n',badgeClass:'badge-n8n',tags:['Чек-лист','Запуск','Workflow']},
            {id:'glossary',title:'Глоссарий — базовые понятия курса',description:'Словарь терминов курса: LLM, MCP, агенты, n8n, платформы, метрики, контент и безопасность. Более 50 терминов с краткими определениями.',url:'glossary.html',category:'reference',icon:'📖',iconClass:'reference',badge:'Словарь',badgeClass:'badge-reference',tags:['Глоссарий','Справочник','Термины']},
            {id:'visual-pipeline',title:'Чек-лист визуального пайплайна (9 шагов)',description:'От события до экспорта: сборка слота-брифа, генерация 6-8 вариантов, отбор, inpaint, цветокоррекция, этика, запись рецепта. Шпаргалка для ежедневной работы с визуалом.',url:'visual-pipeline.html',category:'visual',icon:'🎨',iconClass:'visual',badge:'Визуал',badgeClass:'badge-visual',tags:['Чек-лист','Визуал','Дизайн','Пайплайн']}
        ];

        function renderManuals(f){f=f||'all';var g=document.getElementById('manualsGrid'),h=f==='all'?manuals:manuals.filter(function(m){return m.category===f});if(!h.length){g.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><p class="empty-text">В этой категории пока нет мануалов</p></div>';return}g.innerHTML=h.map(function(m){return '<article class="manual-card" onclick="openManual(\''+m.url+'\')"><div class="card-header"><div class="card-icon '+m.iconClass+'">'+m.icon+'</div><div class="card-info"><h3 class="card-title">'+m.title+'</h3><div class="card-meta"><span class="card-badge '+m.badgeClass+'">'+m.badge+'</span></div></div></div><p class="card-desc">'+m.description+'</p><div class="card-footer"><div class="card-tags">'+m.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div><button class="open-btn" onclick="event.stopPropagation();openManual(\''+m.url+'\')">Открыть ↗</button></div></article>'}).join('')}

        function openManual(url) {
            var base = window.location.href.replace(/index\.html$/, '');
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openLink(base + url, { try_instant_view: false });
            } else {
                window.open(base + url, '_blank');
            }
        }

        document.querySelectorAll('.filter-tab').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.filter-tab').forEach(function(x){x.classList.remove('active')});t.classList.add('active');renderManuals(t.dataset.filter)})});

        function initTelegram(){if(window.Telegram&&window.Telegram.WebApp){var tg=window.Telegram.WebApp;tg.ready();tg.expand();if(tg.colorScheme==='dark'){document.body.classList.add('tg-theme-dark')}tg.MainButton.setText('На главную');tg.MainButton.onClick(function(){tg.close()})}}

        document.addEventListener('DOMContentLoaded',function(){renderManuals();initTelegram()});
    </script>
</body>
</html>
